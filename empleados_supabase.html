<!DOCTYPE html>

<head>

<title>ALISTA AHORRO - Empleados</title>
<style>
*,*:before,*:after{box-sizing:border-box;margin:0;padding:0}:root{--bg:#f5f3ef;--surface:#fff;--surface2:#f0ede8;--border:#ddd9d3;--text:#1a1a18;--text2:#6b6860;--text3:#9e9b95;--navy:#1a3a5c;--navy-dk:#122a44;--red:#c0392b;--red-bg:#fdf0ee;--green:#1e6b3c;--green-bg:#eaf5ee;--blue-bg:#e6f0fb;--blue:#1a4a8a;--r:10px;--rs:7px}body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;font-size:15px;line-height:1.5}#root{max-width:680px;margin:0 auto;padding:1.5rem 1rem 4rem}input,select,button{font-family:inherit;font-size:14px}input[type=text],input[type=number],input[type=email],input[type=password],select{width:100%;padding:9px 12px;border:1px solid var(--border);border-radius:var(--rs);background:var(--surface);color:var(--text);outline:none}input:focus,select:focus{border-color:var(--navy)}button{cursor:pointer;border-radius:var(--rs);border:1px solid var(--border);padding:8px 16px;background:var(--surface);color:var(--text);transition:.15s;font-size:14px}button:hover{background:var(--surface2)}.bp{background:var(--navy);color:#fff;border-color:var(--navy)}.bp:hover{background:var(--navy-dk)}.bd{background:var(--red-bg);color:var(--red);border-color:#f5c6c0}.bg{background:var(--green-bg);color:var(--green);border-color:#b7dfc4}.sm{padding:4px 10px;font-size:12px}.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:1rem 1.25rem}.surf{background:var(--surface2);border-radius:var(--rs);padding:1rem}.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.lbl{font-size:12px;color:var(--text2);margin-bottom:4px}.col{display:flex;flex-direction:column;gap:8px}.muted{color:var(--text2);font-size:13px}.warn{background:#fff7e6;color:#7a4b00;border:1px solid #f0d59c;border-radius:var(--rs);padding:8px 10px;font-size:12px}.ok{background:var(--green-bg);color:var(--green);border:1px solid #b7dfc4;border-radius:var(--rs);padding:8px 10px;font-size:12px}.badge{font-size:11px;padding:2px 8px;border-radius:99px;font-weight:500;white-space:nowrap}.avatar{border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:500;flex:0 0 auto}.emp-card{cursor:pointer;display:flex;align-items:center;gap:12px;transition:.15s}.emp-card:hover{background:var(--surface2)}.tx-row{display:flex;align-items:center;gap:8px;padding:9px 0;border-bottom:1px solid var(--border)}.tx-row:last-child{border-bottom:0}.tabs{border-bottom:1px solid var(--border);display:flex}.tab{padding:8px 14px;font-size:13px;font-weight:500;background:none;border:none;border-bottom:2px solid transparent;color:var(--text2);border-radius:0}.tab.on{border-bottom-color:var(--navy);color:var(--navy)}.modal-back{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:flex-start;justify-content:center;z-index:1000;padding:1rem;overflow:auto}.modal{background:var(--surface);border-radius:var(--r);border:1px solid var(--border);width:100%;max-width:540px;margin:1.5rem 0 2rem}.row{display:flex;justify-content:space-between;gap:12px;padding:5px 0}.row strong{white-space:nowrap}#print-area{display:none}@media(max-width:520px){.g2{grid-template-columns:1fr}.tx-row{align-items:flex-start;flex-wrap:wrap}}@media print{body>*{display:none!important}#print-area{display:block!important;position:static;width:100%;padding:1.2cm 1.8cm;font-family:Arial,sans-serif;font-size:10.5pt;color:#000;background:#fff}.ph{display:flex;justify-content:space-between;margin-bottom:14pt;padding-bottom:8pt;border-bottom:2.5px solid #1a3a5c}.ph-brand{font-size:17pt;font-weight:bold;color:#1a3a5c}.ph-sub{font-size:8pt;color:#666;margin-top:2pt}.ph-meta{text-align:right;font-size:9.5pt;line-height:1.7}.pe{background:#f0ede8;padding:9pt 12pt;border-radius:4pt;margin-bottom:12pt}.pe-name{font-size:13pt;font-weight:bold}.pe-role{font-size:9pt;color:#555}.ps-title{font-size:8.5pt;font-weight:bold;color:#1a3a5c;text-transform:uppercase;letter-spacing:.5pt;margin:12pt 0 5pt;border-bottom:1px solid #ccc;padding-bottom:2pt}.pt{width:100%;border-collapse:collapse}.pt td{padding:4pt 0;font-size:10pt}.pt td:last-child{text-align:right;font-weight:bold}.pt .sep td{border-top:1px solid #ddd;padding-top:7pt}.pt .total td{border-top:2px solid #1a3a5c;padding-top:7pt;font-size:12pt;font-weight:bold;color:#1a3a5c}.pt .red td{color:#c0392b}.pt .green td{color:#1e6b3c}.p-sigs{display:flex;gap:50pt;margin-top:36pt}.p-sig{flex:1;border-top:1px solid #000;padding-top:5pt;font-size:9pt;color:#444;text-align:center}.p-sig strong{display:block;font-size:10pt;color:#000;margin-bottom:2pt}.p-footer{margin-top:18pt;font-size:7.5pt;color:#aaa;text-align:center;border-top:1px solid #eee;padding-top:6pt}}

#login-screen{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;z-index:9999}
.login-box{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:2rem 2.5rem;width:100%;max-width:360px;box-shadow:0 4px 24px rgba(0,0,0,.08)}
.login-logo{font-size:22px;font-weight:700;color:var(--navy);letter-spacing:-.5px;margin-bottom:4px}
.login-sub{font-size:12px;color:var(--text2);margin-bottom:1.5rem}
.login-err{background:var(--red-bg);color:var(--red);border:1px solid #f5c6c0;border-radius:var(--rs);padding:8px 10px;font-size:13px;margin-bottom:12px;display:none}
</style>

<body>
<div id="login-screen">
  <div class="login-box">
    <div class="login-logo">ALISTA AHORRO</div>
    <div class="login-sub">Control de empleados · <a href="./index.html" style="color:var(--navy)">Volver a módulos</a></div>
    <div id="login-err" class="login-err">Contraseña incorrecta</div>
    <label class="lbl" for="email-input">Correo electrónico</label>
    <input id="email-input" type="email" autocomplete="username" placeholder="Tu correo" style="margin-bottom:12px">
    <label class="lbl" for="pwd-input">Contraseña</label>
    <input id="pwd-input" type="password" autocomplete="current-password" placeholder="Ingresá la contraseña" style="margin-bottom:12px">
    <button id="pwd-btn" class="bp" style="width:100%;padding:10px">Entrar</button>
  </div>
</div>
<div id="root" style="display:none"></div>
<div id="print-area"></div>
<input id="import-file" type="file" accept="application/json" style="display:none">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.4/dist/umd/supabase.js"></script>
<script>
const SB_URL_L='https://dylxexataktknyzfmico.supabase.co';
const SB_KEY_L='sb_publishable_sFShQVlXTDjbfGIXBIce4A_xtX71wRE';
const authClient=window.supabase ? window.supabase.createClient(SB_URL_L,SB_KEY_L) : null;
let appStarted=false;
function showLogin(message){
  document.getElementById('login-screen').style.display='flex';
  document.getElementById('root').style.display='none';
  const err=document.getElementById('login-err');
  err.textContent=message||'';
  err.style.display=message?'block':'none';
}
function openApp(){
  document.getElementById('pwd-input').value='';
  document.getElementById('login-screen').style.display='none';
  document.getElementById('root').style.display='';
  if(!appStarted){appStarted=true;startApp();}
}
async function tryLogin(){
  const email=document.getElementById('email-input').value.trim();
  const password=document.getElementById('pwd-input').value;
  if(!email||!password){showLogin('Ingresá tu correo y contraseña.');return;}
  const btn=document.getElementById('pwd-btn');
  btn.textContent='Verificando...';btn.disabled=true;
  try{
    if(!authClient)throw new Error('No se pudo cargar el servicio de acceso. Recargá la página.');
    const {data,error}=await authClient.auth.signInWithPassword({email,password});
    if(error||!data.session)throw new Error('No se pudo ingresar. Revisá tu correo y contraseña.');
    openApp();
  }catch(e){showLogin(e.message);}
  finally{btn.textContent='Entrar';btn.disabled=false;}
}
document.getElementById('pwd-btn').addEventListener('click',tryLogin);
document.getElementById('pwd-input').addEventListener('keydown',function(e){if(e.key==='Enter')tryLogin();});
document.getElementById('email-input').addEventListener('keydown',function(e){if(e.key==='Enter')tryLogin();});
function startApp(){
'use strict';
const AVC=['#1a3a5c','#2e7d32','#6a1b9a','#bf360c','#00695c','#558b2f','#4527a0','#ad1457'];
function uid(){return Math.random().toString(36).slice(2,9)}
function n(v){return parseFloat(v)||0;}
function money(v){return new Intl.NumberFormat('es-AR',{style:'currency',currency:'ARS',maximumFractionDigits:0}).format(Math.abs(v));}
function dateTime(d){return new Date(d).toLocaleString('es-AR',{day:'2-digit',month:'2-digit',year:'2-digit',hour:'2-digit',minute:'2-digit'});}
function dateLong(d){return new Date(d).toLocaleDateString('es-AR',{day:'numeric',month:'long',year:'numeric'});}
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function $(id){return document.getElementById(id);}
const root=$('root');
const TX_SIGN={mercaderia:1,mercaderia_fs:1,adelanto:1,otro:1,pago:-1,cuota:-1,liq_desc:-1};
const TX_LABEL={mercaderia_fs:'Fuera de sistema',adelanto:'Adelanto',otro:'Otro',pago:'Pago',cuota:'Cuota plan',liq_desc:'Desc. liquidacion'};
const TX_COLOR={mercaderia_fs:'#e6f0fb',adelanto:'#fff3e0',otro:'#f3e5f5',pago:'#eaf5ee',cuota:'#eaf5ee',liq_desc:'#fce4ec'};
const TX_TC={mercaderia_fs:'#1a4a8a',adelanto:'#e65100',otro:'#6a1b9a',pago:'#1e6b3c',cuota:'#1e6b3c',liq_desc:'#880e4f'};
const st={emp:[],tx:[],plans:[],liq:[],view:'list',sel:null,showAdd:false,tab:'mov',showLiq:false,editTx:null,modal:null,msg:'',warn:'',confirmDel:false,groupSel:{},groupPeriodo:''};
const SB_URL='https://dylxexataktknyzfmico.supabase.co';
const SB_KEY='sb_publishable_sFShQVlXTDjbfGIXBIce4A_xtX71wRE';
async function sbFetch(path,opts){
  opts=opts||{};
  const {data,error}=await authClient.auth.getSession();
  if(error||!data.session){showLogin('Tu sesión terminó. Volvé a ingresar.');throw new Error('Sesión requerida');}
  const headers={'apikey':SB_KEY,'Authorization':'Bearer '+data.session.access_token,'Content-Type':'application/json','Prefer':'return=representation'};
  if(opts.headers)Object.assign(headers,opts.headers);
  const r=await fetch(SB_URL+'/rest/v1/'+path,Object.assign({},opts,{headers:headers}));
  if(!r.ok){const e=await r.text();throw new Error(e);}
  if(r.status===204)return[];
  const t=await r.text();return t?JSON.parse(t):[];
}
async function sbUpsert(table,rows){
  if(!rows||!rows.length)return;
  return sbFetch(table,{method:'POST',headers:{'Prefer':'resolution=merge-duplicates'},body:JSON.stringify(rows)});
}
async function sbDelete(table,id){return sbFetch(table+'?id=eq.'+id,{method:'DELETE'});}
async function saveToSB(){
  try{
    await Promise.all([
      sbUpsert('employees',st.emp.map(function(e){return{id:e.id,name:e.name,role:e.role,created_at:e.createdAt};})),
      sbUpsert('transactions',st.tx.map(function(t){return{id:t.id,employee_id:t.employeeId,type:t.type,amount:t.amount,description:t.description,date:t.date};})),
      sbUpsert('liquidaciones',st.liq.map(function(l){return{id:l.id,employee_id:l.employeeId,periodo:l.periodo,sueldo_bruto:l.sueldoBruto,bono_extra:l.bonoExtra,bono_detalle:l.bonoDetalle,descuento_deuda:l.descuentoDeuda,deuda_financiada:l.deudaFinanciada,notas:l.notas,deuda_al_inicio:l.deudaAlInicio,date:l.date};})),
    ]);
  }catch(e){flash('Error al guardar: '+e.message);}
}
async function deleteEmpFromSB(id){try{await sbDelete('employees',id);}catch(e){flash('Error: '+e.message);}}
async function init(){
  root.innerHTML='<div style="padding:3rem;text-align:center;color:#888">Conectando...</div>';
  try{
    const res=await Promise.all([sbFetch('employees?select=*'),sbFetch('transactions?select=*'),sbFetch('liquidaciones?select=*'),sbFetch('plans?select=*')]);
    const emps=res[0],txs=res[1],liqs=res[2],pls=res[3];

    st.emp=emps.map(function(e){return{id:e.id,name:e.name,role:e.role||'',createdAt:e.created_at||Date.now(),grossBase:e.gross_base==null?null:Number(e.gross_base)};});
    const ids=new Set(st.emp.map(function(e){return e.id;}));
    st.tx=txs.map(function(t){return{id:t.id,employeeId:t.employee_id,type:t.type,amount:Math.abs(n(t.amount)),description:t.description||'',date:t.date||Date.now()};}).filter(function(t){return ids.has(t.employeeId)&&t.amount>0;});
    st.liq=liqs.map(function(l){return{id:l.id,employeeId:l.employee_id,periodo:l.periodo||'',sueldoBruto:Math.abs(n(l.sueldo_bruto)),bonoExtra:Math.abs(n(l.bono_extra)),bonoDetalle:l.bono_detalle||'',descuentoDeuda:Math.abs(n(l.descuento_deuda)),deudaFinanciada:Math.abs(n(l.deuda_financiada)),notas:l.notas||'',deudaAlInicio:Math.abs(n(l.deuda_al_inicio)),date:l.date||Date.now()};}).filter(function(l){return ids.has(l.employeeId);});
    st.plans=pls.map(function(p){return{id:p.id,employeeId:p.employee_id,totalAmount:Math.abs(n(p.total)),totalInstallments:Math.max(1,parseInt(p.installments||1)),installmentAmount:0,paidInstallments:Math.max(0,parseInt(p.paid||0)),active:true,createdAt:p.created_at||Date.now()};}).filter(function(p){return ids.has(p.employeeId);});
    render();
  }catch(e){
    root.innerHTML='<div style="padding:2rem;max-width:500px;margin:0 auto"><div class="card"><h3 style="color:var(--red);margin-bottom:8px">Error de conexion</h3><div class="muted">'+esc(e.message)+'</div></div></div>';
  }
}
function sign(t){return TX_SIGN[t]!=null?TX_SIGN[t]:0;}
function debt(id){return st.tx.filter(function(t){return t.employeeId===id;}).reduce(function(s,t){return s+sign(t.type)*t.amount;},0);}
function emp(){return st.emp.find(function(e){return e.id===st.sel;});}
function initials(nm){return nm.trim().split(/\s+/).slice(0,2).map(function(w){return w[0]?w[0].toUpperCase():'';}).join('');}
function avatar(name,size){size=size||40;const c=AVC[name.charCodeAt(0)%AVC.length];return '<div class="avatar" style="width:'+size+'px;height:'+size+'px;min-width:'+size+'px;background:'+c+';font-size:'+(size*.35)+'px">'+initials(name)+'</div>';}
function badge(type){return '<span class="badge" style="background:'+(TX_COLOR[type]||'#eee')+';color:'+(TX_TC[type]||'#333')+'">'+esc(TX_LABEL[type]||type)+'</span>';}
function msg(){return st.msg?'<div class="ok" style="margin-bottom:12px">'+esc(st.msg)+'</div>':st.warn?'<div class="warn" style="margin-bottom:12px" data-a="clearWarn">'+esc(st.warn)+'</div>':'';}
function flash(m){st.msg=m;render();setTimeout(function(){st.msg='';render();},2500);}
function render(){
  try{root.innerHTML=st.view==='detail'?detail():st.view==='groupSelect'?groupSelectView():st.view==='groupLiq'?groupLiqForm():st.view==='lastGroup'?lastGroupView():list();if(st.view==='list')root.insertAdjacentHTML('afterbegin','<button data-a="lastGroup" style="width:100%;margin-bottom:12px">Ver última liquidación grupal</button>');root.insertAdjacentHTML('afterbegin','<nav aria-label="Navegación del ecosistema" style="display:flex;align-items:center;gap:12px;margin-bottom:20px;font-size:13px"><a href="./index.html" style="color:var(--navy);text-decoration:none;font-weight:600">← Ecosistema ALISTA</a><span style="color:var(--text2)">/ Empleados</span></nav>');setFocus();}
  catch(e){root.innerHTML='<div class="card"><h3 style="color:var(--red);margin-bottom:8px">Error</h3><div class="muted">'+esc(e.message)+'</div><button data-a="resetView" style="margin-top:12px">Volver</button></div>';}
}
function setFocus(){const f=document.querySelector('[data-focus]');if(f)f.focus();}
function list(){
  const total=st.emp.reduce(function(s,e){const d=debt(e.id);return s+(d>0?d:0);},0);
  const debtors=st.emp.filter(function(e){return debt(e.id)>0;}).length;
  const sorted=[...st.emp].sort(function(a,b){return debt(b.id)-debt(a.id);});
  return msg()+'<div style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:16px"><div><div style="font-weight:600;font-size:18px;letter-spacing:-.3px">ALISTA AHORRO</div><div style="font-size:12px;color:var(--text2)">Control de empleados</div></div><div style="display:flex;gap:6px;flex-wrap:wrap"><button class="sm" data-a="logout">Cerrar sesión</button><button class="sm" data-a="export">Exportar backup</button><button class="sm" data-a="import">Importar</button><button class="sm" data-a="groupLiqStart" style="background:var(--navy);color:#fff;border-color:var(--navy)">Liq. grupal</button><button class="bp sm" data-a="toggleAdd">'+(st.showAdd?'Cancelar':'+ Empleado')+'</button></div></div>'+(st.showAdd?addEmpForm():'')+'<div class="g2" style="margin-bottom:16px"><div class="surf" style="text-align:center"><div class="lbl">Deuda total</div><div style="font-size:22px;font-weight:500;color:var(--red)">'+money(total)+'</div></div><div class="surf" style="text-align:center"><div class="lbl">Con deuda / Total</div><div style="font-size:22px;font-weight:500">'+debtors+' / '+st.emp.length+'</div></div></div><div style="display:flex;flex-direction:column;gap:6px">'+sorted.map(empCard).join('')+'</div>';
}
function addEmpForm(){return '<div class="card" style="margin-bottom:12px"><div class="lbl">Nombre *</div><input data-focus id="newName" type="text" placeholder="Nombre completo" style="margin-bottom:8px"><div class="lbl">Cargo / Rol</div><input id="newRole" type="text" placeholder="Ej: Cajero, Repositor..." style="margin-bottom:10px"><button class="bp" data-a="addEmp" style="width:100%">Agregar empleado</button></div>';}
function empCard(e){const d=debt(e.id);return '<div class="card emp-card" data-a="select" data-id="'+e.id+'">'+avatar(e.name)+'<div style="flex:1"><div style="font-weight:500">'+esc(e.name)+'</div>'+(e.role?'<div style="font-size:12px;color:var(--text2)">'+esc(e.role)+'</div>':'')+'</div><div style="text-align:right"><div style="font-weight:500;color:'+(d>0?'var(--red)':'var(--green)')+'">'+( d>0?money(d):'Al dia')+'</div></div><span style="color:var(--text3);font-size:18px">&#x203A;</span></div>';}

const attendanceState={week:attendanceMonday(),employeeId:null,data:null,loading:false,error:'',request:0};
function attendanceMonday(value){
  const today=value||new Intl.DateTimeFormat('en-CA',{timeZone:'America/Argentina/Cordoba',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date());
  const d=new Date(today+'T12:00:00Z'); d.setUTCDate(d.getUTCDate()-((d.getUTCDay()+6)%7)); return d.toISOString().slice(0,10);
}
function attendanceDate(key){return key.slice(8,10)+'/'+key.slice(5,7)+'/'+key.slice(0,4);}
function attendanceShift(days){
  const d=new Date(attendanceState.week+'T12:00:00Z');d.setUTCDate(d.getUTCDate()+days);attendanceState.week=d.toISOString().slice(0,10);
  loadAttendance();
}
async function loadAttendance(){
  const e=emp();if(!e)return;
  const request=++attendanceState.request, id=e.id, week=attendanceState.week;
  attendanceState.employeeId=id;attendanceState.data=null;attendanceState.loading=true;attendanceState.error='';render();
  const controller=new AbortController(),timeout=setTimeout(()=>controller.abort(),45000);
  try{
    const {data,error}=await authClient.auth.getSession();
    if(error||!data.session)throw new Error('Tu sesión terminó. Volvé a ingresar.');
    const res=await fetch(SB_URL+'/functions/v1/attendance-weekly',{method:'POST',signal:controller.signal,headers:{apikey:SB_KEY,Authorization:'Bearer '+data.session.access_token,'Content-Type':'application/json'},body:JSON.stringify({employeeId:id,weekStart:week})});
    const report=await res.json();
    if(!res.ok||!report.ok)throw new Error(report.error||'No se pudo consultar asistencia.');
    if(request===attendanceState.request)attendanceState.data=report;
  }catch(error){if(request===attendanceState.request)attendanceState.error=error.name==='AbortError'?'La consulta demoró demasiado. Volvé a intentar.':error.message;}
  finally{clearTimeout(timeout);if(request===attendanceState.request){attendanceState.loading=false;if(st.view==='detail'&&st.sel===id)render();}}
}
function attendanceException(id){
  return id==='ed9l8b8'?'Sin obligación de fichaje (función especial)':id==='k89dura6gn'?'Ya no trabaja; sin control de asistencia':'';
}
function attendanceHours(day){
  let minutes=0,pairs=0,incomplete=false,pending=false,review=false;
  for(let i=0;i<4;i+=2){
    const start=day.entries[i],end=day.entries[i+1];
    review=review||!!start.review||!!end.review;
    if(start.state==='Descanso'&&end.state==='Descanso')continue;
    if(start.state==='Sin control'&&end.state==='Sin control')continue;
    const parse=t=>/^\d{2}:\d{2}$/.test(t||'')?Number(t.slice(0,2))*60+Number(t.slice(3)):null;
    const a=parse(start.time),b=parse(end.time);
    if(a!==null&&b!==null&&b>=a){minutes+=b-a;pairs++;}
    else if(a!==null&&b!==null){incomplete=true;review=true;}
    else if(start.state==='Pendiente'||end.state==='Pendiente'){pending=true;}
    else incomplete=true;
  }
  return {minutes,pairs,incomplete,pending,review};
}
function attendanceDuration(minutes){return Math.floor(minutes/60)+' h '+String(minutes%60).padStart(2,'0')+' min';}
function attendanceWeekHours(report){
  return report.days.reduce((s,d)=>{const h=attendanceHours(d);s.minutes+=h.minutes;s.pairs+=h.pairs;s.incomplete+=h.incomplete?1:0;s.pending+=h.pending?1:0;s.review+=h.review?1:0;return s;},{minutes:0,pairs:0,incomplete:0,pending:0,review:0});
}
function attendanceHoursLabel(h){return (h.pairs?attendanceDuration(h.minutes):'—')+(h.incomplete?' · Incompleto':'')+(h.pending?' · Pendiente':'')+(h.review?' · Revisar':'');}
function payrollAttendanceText(report,id){
  const exception=attendanceException(id);if(exception)return exception;
  if(!report.linked)return 'Sin vincular al padrón de asistencias';
  const s=report.summary,h=attendanceWeekHours(report);
  return s.daysWithRecords+'/6 días con fichajes · '+s.lateCount+' tardanzas ('+s.lateMinutes+' min) · '+s.missingCount+' movimientos sin fichaje · '+s.reviewCount+' para revisar. Horas registradas: '+attendanceHoursLabel(h)+'.';
}
function payrollWeekLabel(week){const end=new Date(week+'T12:00:00Z');end.setUTCDate(end.getUTCDate()+5);return attendanceDate(week)+' al '+attendanceDate(end.toISOString().slice(0,10));}
let payrollBusy=false;
async function preparePayrollAttendance(items,week){
  if(!/^\d{4}-\d{2}-\d{2}$/.test(week)||attendanceMonday(week)!==week||week>attendanceMonday())throw new Error('Elegí el lunes de la semana a liquidar, sin fechas futuras.');
  const {data,error}=await authClient.auth.getSession();
  if(error||!data.session)throw new Error('Tu sesión terminó. Volvé a ingresar.');
  let next=0;
  async function worker(){
    while(next<items.length){
      const item=items[next++],exception=attendanceException(item.e.id);
      if(exception){item.attendanceSummary=exception;continue;}
      const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),45000);
      try{
        const res=await fetch(SB_URL+'/functions/v1/attendance-weekly',{method:'POST',signal:controller.signal,headers:{apikey:SB_KEY,Authorization:'Bearer '+data.session.access_token,'Content-Type':'application/json'},body:JSON.stringify({employeeId:item.e.id,weekStart:week})});
        const report=await res.json();
        if(!res.ok||!report.ok)throw new Error(report.error||'No se pudo consultar asistencia.');
        item.attendanceSummary=payrollAttendanceText(report,item.e.id);
      }catch(error){throw new Error('Asistencia de '+item.e.name+': '+(error.name==='AbortError'?'la consulta demoró demasiado. Reintentá.':error.message));}
      finally{clearTimeout(timer);}
    }
  }
  const results=await Promise.allSettled(Array.from({length:Math.min(3,items.length)},worker));
  const failed=results.find(r=>r.status==='rejected');if(failed)throw failed.reason;
  items.forEach(x=>{x.attendanceNote='Asistencia '+payrollWeekLabel(week)+': '+x.attendanceSummary+(week===attendanceMonday()?' Semana en curso: parcial.':'');});
}

}

function receiptWeek(l){

  if(a==='showLiq'){st.showLiq=true;render();}
  if(a==='cancelLiq'){st.showLiq=false;render();}
  if(a==='saveLiq'&&e){if(!validateGrossInputs(false))return;const per=($('lPer')||{value:''}).value.trim();if(!per)return flash('Falta el periodo.');const sb=n(($('lSB')||{value:0}).value),bo=n(($('lBo')||{value:0}).value),de=n(($('lDe')||{value:0}).value),fi=n(($('lFi')||{value:0}).value);const l={id:uid(),employeeId:e.id,periodo:per,sueldoBruto:sb,bonoExtra:bo,bonoDetalle:($('lBD')||{value:''}).value.trim(),descuentoDeuda:de,deudaFinanciada:fi,notas:($('lNo')||{value:''}).value.trim(),deudaAlInicio:Math.max(0,debt(e.id)),date:Date.now()};st.liq.push(l);if(de>0)st.tx.push({id:uid(),employeeId:e.id,type:'liq_desc',amount:de,description:'Desc. liq. '+per,date:Date.now()});st.showLiq=false;saveToSB();flash('Liquidacion guardada.');}
  if(a==='viewSlip'){st.modal=id;render();}
  if(a==='closeSlip'){st.modal=null;render();}
  if((a==='printSlip'||a==='loadSlipAttendance')&&e){
    const l=st.liq.find(x=>x.id===st.modal);if(!l)return;
    try{const note=await loadReceiptAttendance(l,e,el);if(a==='printSlip'){$('print-area').innerHTML='<style>@page{size:A4 portrait;margin:0}</style>'+slipPrint(l,e,note);window.print();}}catch(error){}return;
  }
  if(a==='delStart'){st.confirmDel=true;render();}
  if(a==='delCancel'){st.confirmDel=false;render();}
  if(a==='delConfirm'&&e){const eid=e.id;st.emp=st.emp.filter(function(x){return x.id!==eid;});st.tx=st.tx.filter(function(x){return x.employeeId!==eid;});st.plans=st.plans.filter(function(x){return x.employeeId!==eid;});st.liq=st.liq.filter(function(x){return x.employeeId!==eid;});st.view='list';st.sel=null;deleteEmpFromSB(eid);saveToSB();flash('Empleado eliminado.');render();}
  if(a==='export'){const d={version:'alista-empleados-supabase',createdAt:new Date().toISOString(),employees:st.emp,transactions:st.tx,plans:st.plans,liquidaciones:st.liq};const b=new Blob([JSON.stringify(d,null,2)],{type:'application/json'});const lk=document.createElement('a');lk.href=URL.createObjectURL(b);lk.download='backup_alista_empleados.json';lk.click();}
  if(a==='import'){$('import-file').click();}
  if(a==='lastGroup'){st.view='lastGroup';render();}
  if(a==='backToList'){st.view='list';render();}
  if(a==='groupLiqStart'){st.view='groupSelect';st.groupSel={};st.groupPeriodo='';render();}
  if(a==='toggleGroupEmp'){st.groupSel[id]=!st.groupSel[id];render();}
  if(a==='cancelGroup'){st.view='list';st.groupSel={};render();}
  if(a==='continueGroup'){if(Object.values(st.groupSel).some(Boolean)){st.view='groupLiq';render();}}
  if(a==='previewIndividual'||a==='previewGroup'||a==='saveGroup'){
    if(!validateGrossInputs(true))return;
    const r=getGroupItems(),week=($('gAttendanceWeek')||{value:''}).value,status=$('gAttendanceStatus');
    if(!r.periodo){status.textContent='Falta el período de liquidación.';return;}
    if(!r.items.length){status.textContent='Seleccioná al menos un empleado.';return;}
    payrollBusy=true;
    const controls=Array.from($('root').querySelectorAll('input,button,select')).map(x=>[x,x.disabled]);controls.forEach(x=>x[0].disabled=true);
    status.textContent='Consultando asistencia para la planilla…';
    try{
      await preparePayrollAttendance(r.items,week);
      if(a==='saveGroup'){
        const batchDate=Date.now();st.groupPeriodo=r.periodo;
        r.items.forEach(function(x){st.liq.push({id:uid(),employeeId:x.e.id,periodo:r.periodo,sueldoBruto:x.bruto,bonoExtra:x.bono,bonoDetalle:x.bonoDesc,descuentoDeuda:x.desc,deudaFinanciada:x.fin,notas:x.attendanceNote,deudaAlInicio:x.deudaInicio,date:batchDate});if(x.desc>0)st.tx.push({id:uid(),employeeId:x.e.id,type:'liq_desc',amount:x.desc,description:'Desc. liq. '+r.periodo,date:batchDate});});
        saveToSB();
      }
      $('print-area').innerHTML=a==='previewIndividual'?'<style>@page{size:A4 portrait;margin:0}</style>'+groupIndividualPrint(r.periodo,r.items):groupPrintHTML(r.periodo,r.items,week);status.textContent='Resumen de asistencia listo: '+payrollWeekLabel(week)+'.';window.print();
      if(a==='saveGroup'){st.view='list';st.groupSel={};st.groupPeriodo='';flash('Liquidacion grupal guardada con resumen de asistencia.');render();}
    }catch(error){status.textContent=error.message+' No se guardó la liquidación. Tus importes se conservaron.';}
    finally{payrollBusy=false;controls.forEach(x=>x[0].disabled=x[1]);}
  }
});
document.addEventListener('change',function(ev){
  if(ev.target.id==='import-file'){const f=ev.target.files[0];if(!f)return;const r=new FileReader();r.onload=function(e){try{const d=JSON.parse(e.target.result);if(!d.employees)throw new Error('Formato invalido');st.emp=d.employees;st.tx=d.transactions||[];st.liq=d.liquidaciones||[];st.plans=d.plans||[];saveToSB();flash('Datos importados correctamente.');}catch(ex){flash('Error al importar: '+ex.message);}};r.readAsText(f);}
});
init();

}
if(authClient){
  authClient.auth.onAuthStateChange(function(event,session){
    if(event==='SIGNED_OUT'){document.getElementById('root').innerHTML='';showLogin('Sesión cerrada.');if(appStarted)location.reload();}
  });
  authClient.auth.getSession().then(function(result){
    if(result.data.session)openApp();else showLogin();
  }).catch(function(){showLogin('No se pudo recuperar la sesión. Volvé a ingresar.');});
}else{showLogin('No se pudo cargar el servicio de acceso. Recargá la página.');}
</script>
</body>
