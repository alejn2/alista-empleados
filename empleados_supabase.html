async function checkPassword(pwd){
  try{
    const r=await fetch(SB_URL_L+'/rest/v1/app_config?key=eq.password&select=value',{headers:{'apikey':SB_KEY_L,'Authorization':'Bearer '+SB_KEY_L}});
    const d=await r.json();return d.length>0&&d[0].value===pwd;
  }catch(e){throw new Error('Sin conexion a internet');}
}
async function tryLogin(){
  const pwd=document.getElementById('pwd-input').value;
  if(!pwd)return;
  const btn=document.getElementById('pwd-btn');
  btn.textContent='Verificando...';btn.disabled=true;
  try{
    const ok=await checkPassword(pwd);
    if(ok){
      sessionStorage.setItem(SESSION_KEY,'1');
      document.getElementById('login-screen').style.display='none';
      document.getElementById('root').style.display='';
      startApp();
    }else{
      document.getElementById('login-err').textContent='Contrasena incorrecta';
      document.getElementById('login-err').style.display='block';
      btn.textContent='Entrar';btn.disabled=false;
    }
  }catch(e){
    document.getElementById('login-err').textContent='Error: '+e.message;
    document.getElementById('login-err').style.display='block';
    btn.textContent='Entrar';btn.disabled=false;
  }
}
document.getElementById('pwd-btn').addEventListener('click',tryLogin);
document.getElementById('pwd-input').addEventListener('keydown',function(e){if(e.key==='Enter')tryLogin();});

async function sbFetch(path,opts){
  opts=opts||{};
  const headers={'apikey':SB_KEY,'Authorization':'Bearer '+SB_KEY,'Content-Type':'application/json','Prefer':'return=representation'};
  if(opts.headers)Object.assign(headers,opts.headers);
  const r=await fetch(SB_URL+'/rest/v1/'+path,Object.assign({},opts,{headers:headers}));
  if(!r.ok){const e=await r.text();throw new Error(e);}
  if(r.status===204)return[];
  const t=await r.text();return t?JSON.parse(t):[];
}
async function sbUpsert(table,rows){
  if(!rows||!rows.length)return;
  return sbFetch(table,{method:'POST',headers:{'Prefer':'resolution=merge-duplicates'},body:JSON.stringify(rows)});
}
async function sbDelete(table,id){return sbFetch(table+'?id=eq.'+id,{method:'DELETE'});}

async function init(){
  root.innerHTML='<div style="padding:3rem;text-align:center;color:#888">Conectando...</div>';
  try{
    const res=await Promise.all([sbFetch('employees?select=*'),sbFetch('transactions?select=*'),sbFetch('liquidaciones?select=*'),sbFetch('plans?select=*')]);
    const emps=res[0],txs=res[1],liqs=res[2],pls=res[3];
    if(!emps||emps.length===0){await seedFromBackup();return init();}
    st.emp=emps.map(function(e){return{id:e.id,name:e.name,role:e.role||'',createdAt:e.created_at||Date.now()};});
    const ids=new Set(st.emp.map(function(e){return e.id;}));
    st.tx=txs.map(function(t){return{id:t.id,employeeId:t.employee_id,type:t.type,amount:Math.abs(n(t.amount)),description:t.description||'',date:t.date||Date.now()};}).filter(function(t){return ids.has(t.employeeId)&&t.amount>0;});
    st.liq=liqs.map(function(l){return{id:l.id,employeeId:l.employee_id,periodo:l.periodo||'',sueldoBruto:Math.abs(n(l.sueldo_bruto)),bonoExtra:Math.abs(n(l.bono_extra)),bonoDetalle:l.bono_detalle||'',descuentoDeuda:Math.abs(n(l.descuento_deuda)),deudaFinanciada:Math.abs(n(l.deuda_financiada)),notas:l.notas||'',deudaAlInicio:Math.abs(n(l.deuda_al_inicio)),date:l.date||Date.now()};}).filter(function(l){return ids.has(l.employeeId);});
    st.plans=pls.map(function(p){return{id:p.id,employeeId:p.employee_id,totalAmount:Math.abs(n(p.total)),totalInstallments:Math.max(1,parseInt(p.installments||1)),installmentAmount:0,paidInstallments:Math.max(0,parseInt(p.paid||0)),active:true,createdAt:p.created_at||Date.now()};}).filter(function(p){return ids.has(p.employeeId);});
    render();
  }catch(e){
    root.innerHTML='<div style="padding:2rem;max-width:500px;margin:0 auto"><div class="card"><h3 style="color:var(--red);margin-bottom:8px">Error de conexion</h3><div class="muted">'+esc(e.message)+'</div></div></div>';
  }
}

function emp(){return st.emp.find(function(e){return e.id===st.sel;});}
function initials(nm){return nm.trim().split(/\s+/).slice(0,2).map(function(w){return w[0]?w[0].toUpperCase():'';}).join('');}
function avatar(name,size){size=size||40;const c=AVC[name.charCodeAt(0)%AVC.length];return '<div class="avatar" style="width:'+size+'px;height:'+size+'px;min-width:'+size+'px;background:'+c+';font-size:'+(size*.35)+'px">'+initials(name)+'</div>';}
function badge(type){return '<span class="badge" style="background:'+(TX_COLOR[type]||'#eee')+';color:'+(TX_TC[type]||'#333')+'">'+esc(TX_LABEL[type]||type)+'</span>';}
function msg(){return st.msg?'<div class="ok" style="margin-bottom:12px">'+esc(st.msg)+'</div>':st.warn?'<div class="warn" style="margin-bottom:12px" data-a="clearWarn">'+esc(st.warn)+'</div>':'';}
function flash(m){st.msg=m;render();setTimeout(function(){st.msg='';render();},2500);}
function render(){
  try{root.innerHTML=st.view==='detail'?detail():st.view==='groupSelect'?groupSelectView():st.view==='groupLiq'?groupLiqForm():list();setFocus();}
  catch(e){root.innerHTML='<div class="card"><h3 style="color:var(--red);margin-bottom:8px">Error</h3><div class="muted">'+esc(e.message)+'</div><button data-a="resetView" style="margin-top:12px">Volver</button></div>';}
}
function setFocus(){const f=document.querySelector('[data-focus]');if(f)f.focus();}
function list(){
  const total=st.emp.reduce(function(s,e){const d=debt(e.id);return s+(d>0?d:0);},0);
  const debtors=st.emp.filter(function(e){return debt(e.id)>0;}).length;
  const sorted=[...st.emp].sort(function(a,b){return debt(b.id)-debt(a.id);});
  return msg()+'<div style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:16px"><div><div style="font-weight:600;font-size:18px;letter-spacing:-.3px">ALISTA AHORRO</div><div style="font-size:12px;color:var(--text2)">Control de empleados</div></div><div style="display:flex;gap:6px;flex-wrap:wrap"><button class="sm" data-a="export">Exportar backup</button><button class="sm" data-a="import">Importar</button><button class="sm" data-a="groupLiqStart" style="background:var(--navy);color:#fff;border-color:var(--navy)">Liq. grupal</button><button class="bp sm" data-a="toggleAdd">'+(st.showAdd?'Cancelar':'+ Empleado')+'</button></div></div>'+(st.showAdd?addEmpForm():'')+'<div class="g2" style="margin-bottom:16px"><div class="surf" style="text-align:center"><div class="lbl">Deuda total</div><div style="font-size:22px;font-weight:500;color:var(--red)">'+money(total)+'</div></div><div class="surf" style="text-align:center"><div class="lbl">Con deuda / Total</div><div style="font-size:22px;font-weight:500">'+debtors+' / '+st.emp.length+'</div></div></div><div style="display:flex;flex-direction:column;gap:6px">'+sorted.map(empCard).join('')+'</div>';
}
function addEmpForm(){return '<div class="card" style="margin-bottom:12px"><div class="lbl">Nombre *</div><input data-focus id="newName" type="text" placeholder="Nombre completo" style="margin-bottom:8px"><div class="lbl">Cargo / Rol</div><input id="newRole" type="text" placeholder="Ej: Cajero, Repositor..." style="margin-bottom:10px"><button class="bp" data-a="addEmp" style="width:100%">Agregar empleado</button></div>';}
function empCard(e){const d=debt(e.id);return '<div class="card emp-card" data-a="select" data-id="'+e.id+'">'+avatar(e.name)+'<div style="flex:1"><div style="font-weight:500">'+esc(e.name)+'</div>'+(e.role?'<div style="font-size:12px;color:var(--text2)">'+esc(e.role)+'</div>':'')+'</div><div style="text-align:right"><div style="font-weight:500;color:'+(d>0?'var(--red)':'var(--green)')+'">'+( d>0?money(d):'Al dia')+'</div></div><span style="color:var(--text3);font-size:18px">&#x203A;</span></div>';}
function detail(){
  const e=emp();if(!e){st.view='list';return list();}
  const d=debt(e.id),liq=st.liq.filter(function(l){return l.employeeId===e.id;}).sort(function(a,b){return b.date-a.date;});
  return msg()+(st.modal?slipModal(e,st.liq.find(function(l){return l.id===st.modal;})):'')+'<div style="display:flex;flex-direction:column;gap:12px"><div style="display:flex;align-items:center;gap:10px"><button data-a="back" style="font-size:20px;padding:3px 10px;line-height:1">&#x2190;</button>'+avatar(e.name)+'<div style="flex:1"><div style="font-weight:500;font-size:17px">'+esc(e.name)+'</div>'+(e.role?'<div style="font-size:12px;color:var(--text2)">'+esc(e.role)+'</div>':'')+'</div></div><div class="g2"><div class="surf" style="text-align:center"><div class="lbl">Deuda actual</div><div style="font-size:22px;font-weight:500;color:'+(d>0?'var(--red)':'var(--green)')+'">'+( d>0?money(d):'Sin deuda')+'</div></div><div class="surf" style="text-align:center"><div class="lbl">Liquidaciones</div><div style="font-size:22px;font-weight:500">'+liq.length+'</div></div></div>'+(st.confirmDel?'<div class="card" style="border-color:var(--red)"><div style="font-weight:500;margin-bottom:8px;color:var(--red)">Eliminar a '+esc(e.name)+'?</div><div style="display:flex;gap:8px"><button class="bd" data-a="delConfirm">Si, eliminar</button><button data-a="delCancel">Cancelar</button></div></div>':'<button class="bd sm" data-a="delStart" style="align-self:flex-start">Eliminar empleado</button>')+'<div class="tabs"><button class="tab'+(st.tab==='mov'?' on':'')+'" data-a="tab" data-id="mov">Movimientos</button><button class="tab'+(st.tab==='liq'?' on':'')+'" data-a="tab" data-id="liq">Liquidaciones</button></div>'+(st.tab==='mov'?movements(e):liquidaciones(e,liq,Math.max(0,d)))+'</div>';
}
function movements(e){
  const empTx=st.tx.filter(function(t){return t.employeeId===e.id;}).sort(function(a,b){return b.date-a.date;});
  return '<div class="card"><div style="font-weight:500;margin-bottom:10px">Registrar movimiento</div><div class="g2" style="margin-bottom:8px"><div><div class="lbl">Tipo</div><select id="txType"><option value="mercaderia_fs">Mercaderia fuera de sistema</option><option value="adelanto">Adelanto</option><option value="otro">Otro</option><option value="pago">Pago</option></select></div><div><div class="lbl">Monto ($)</div><input id="txAmt" type="number" min="0" placeholder="0" data-focus></div></div><div style="margin-bottom:8px"><div class="lbl">Descripcion (opcional)</div><input id="txDesc" type="text" placeholder="Ej: Fideos, leche..."></div><button class="bp" data-a="addTx" style="width:100%">Registrar movimiento</button></div>'+(empTx.length?'<div class="card"><div style="font-weight:500;margin-bottom:4px">Historial ('+empTx.length+')</div>'+empTx.map(function(t){return txRow(t);}).join('')+'</div>':'');
}
function txRow(t){
  const editing=st.editTx===t.id;
  if(editing)return '<div class="tx-row" style="flex-direction:column;align-items:stretch;gap:8px"><div class="g2"><select id="etType">'+Object.keys(TX_LABEL).map(function(k){return '<option value="'+k+'"'+(t.type===k?' selected':'')+'>'+TX_LABEL[k]+'</option>';}).join('')+'</select><input id="etAmt" type="number" value="'+t.amount+'"></div><input id="etDesc" type="text" value="'+esc(t.description)+'"><div style="display:flex;gap:8px"><button class="bp sm" data-a="saveTx" data-id="'+t.id+'">Guardar</button><button class="sm" data-a="cancelEdit">Cancelar</button></div></div>';
  return '<div class="tx-row">'+badge(t.type)+'<div style="flex:1;font-size:13px;color:var(--text2)">'+(t.description?esc(t.description)+' ':'')+'<span style="font-size:11px">'+dateTime(t.date)+'</span></div><div style="font-weight:500;color:'+(sign(t.type)>0?'var(--red)':'var(--green)')+'">'+( sign(t.type)>0?'+':'-')+money(t.amount)+'</div><button class="sm" data-a="editTx" data-id="'+t.id+'" style="padding:3px 8px">Editar</button><button class="sm bd" data-a="delTx" data-id="'+t.id+'" style="padding:3px 6px">x</button></div>';
}
function liquidaciones(e,arr,d){
  return (st.showLiq?liqForm(d):'<button class="bp" data-a="showLiq" style="width:100%">+ Nueva liquidacion</button>')+'<div class="card" style="margin-top:8px"><div style="font-weight:500;margin-bottom:4px">Fichas ('+arr.length+')</div>'+(arr.length?arr.map(function(l){return liqRow(l);}).join(''):'<div class="muted">Sin liquidaciones registradas.</div>')+'</div>';
}
function liqForm(d){
  return '<div class="card"><div style="font-weight:500;margin-bottom:12px">Nueva liquidacion</div><div style="margin-bottom:8px"><div class="lbl">Periodo *</div><input id="lPer" type="text" placeholder="Ej: Mayo 2026" data-focus></div><div class="g2" style="margin-bottom:8px"><div><div class="lbl">Sueldo bruto ($)</div><input id="lSB" type="number" value="0" min="0"></div><div><div class="lbl">Bono extra ($)</div><input id="lBo" type="number" value="0" min="0"></div></div><div style="margin-bottom:8px"><div class="lbl">Detalle del bono</div><input id="lBD" type="text" placeholder="Ej: Premio presentismo..."></div>'+(d>0?'<div style="background:var(--red-bg);border:1px solid #f5c6c0;border-radius:var(--rs);padding:8px 12px;margin-bottom:8px;font-size:13px">Deuda acumulada: <strong style="color:var(--red)">'+money(d)+'</strong></div>':'<div style="background:var(--green-bg);border:1px solid #b7dfc4;border-radius:var(--rs);padding:8px 12px;margin-bottom:8px;font-size:13px;color:var(--green)">Sin deuda acumulada</div>')+'<div class="g2" style="margin-bottom:8px"><div><div class="lbl">Descuento a deuda ($)</div><input id="lDe" type="number" value="0" min="0"></div><div><div class="lbl">Queda financiada ($)</div><input id="lFi" type="number" value="0" min="0"></div></div><div style="margin-bottom:10px"><div class="lbl">Notas</div><input id="lNo" type="text" placeholder="Opcional..."></div><div style="display:flex;gap:8px"><button class="bp" data-a="saveLiq" style="flex:1">Guardar liquidacion</button><button data-a="cancelLiq" style="flex:1">Cancelar</button></div></div>';
}
function liqRow(l){
  const total=n(l.sueldoBruto)+n(l.bonoExtra),cobra=Math.max(0,total-n(l.descuentoDeuda)),resta=Math.max(0,n(l.deudaAlInicio)-n(l.descuentoDeuda));
  return '<div class="tx-row" style="flex-direction:column;align-items:stretch;gap:2px"><div style="display:flex;justify-content:space-between;align-items:center"><div style="font-weight:500;font-size:14px">'+esc(l.periodo)+'</div><button class="sm" data-a="viewSlip" data-id="'+l.id+'">Ver ficha</button></div><div style="font-size:12px;color:var(--text2)">Cobra '+money(cobra)+' - Deuda resta '+money(resta)+'</div><div style="font-size:11px;color:var(--text3)">'+dateTime(l.date)+'</div></div>';
}
function slipModal(e,l){
  if(!l)return'';
  const total=n(l.sueldoBruto)+n(l.bonoExtra),cobra=Math.max(0,total-n(l.descuentoDeuda)),resta=Math.max(0,n(l.deudaAlInicio)-n(l.descuentoDeuda));
  return '<div class="modal-back"><div class="modal"><div style="padding:1rem 1.25rem;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center"><div style="font-weight:500">Ficha - '+esc(l.periodo)+'</div><button data-a="closeSlip" style="padding:4px 10px">x</button></div><div style="padding:1rem 1.25rem"><div class="surf" style="margin-bottom:12px"><div style="font-size:11px;color:var(--text2);text-transform:uppercase;letter-spacing:.5px;margin-bottom:4px">ALISTA AHORRO - Recibo de liquidacion</div><div style="font-weight:600">'+esc(e.name)+(e.role?' - '+esc(e.role):'')+'</div><div style="font-size:12px;color:var(--text2)">Periodo: '+esc(l.periodo)+' - '+dateLong(l.date)+'</div></div><div style="font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.5px;color:var(--text2);margin-bottom:6px">REMUNERACION</div><div class="row"><span>Sueldo bruto</span><strong>'+money(l.sueldoBruto)+'</strong></div>'+(n(l.bonoExtra)?'<div class="row"><span>'+(l.bonoDetalle||'Bono extra')+'</span><strong>'+money(l.bonoExtra)+'</strong></div>':'')+'<div class="row" style="border-top:1px solid var(--border);padding-top:6px;margin-top:4px"><span><strong>Total a cobrar</strong></span><strong>'+money(total)+'</strong></div><div style="font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.5px;color:var(--text2);margin:10px 0 6px">DEDUCCIONES</div><div class="row" style="color:var(--red)"><span>Descuento a deuda</span><strong>- '+money(l.descuentoDeuda)+'</strong></div><div class="row" style="border-top:1px solid var(--border);padding-top:6px;margin-top:4px"><span><strong>Cobra en mano</strong></span><strong>'+money(cobra)+'</strong></div><div style="font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.5px;color:var(--text2);margin:10px 0 6px">ESTADO DE DEUDA</div><div class="row" style="color:var(--red)"><span>Deuda al inicio del periodo</span><strong>'+money(l.deudaAlInicio)+'</strong></div><div class="row" style="color:var(--green)"><span>Descuento aplicado</span><strong>- '+money(l.descuentoDeuda)+'</strong></div>'+(n(l.deudaFinanciada)?'<div class="row"><span>Queda financiada en cuotas</span><strong>'+money(l.deudaFinanciada)+'</strong></div>':'')+'<div class="row" style="border-top:1px solid var(--border);padding-top:6px;margin-top:4px"><span><strong>Deuda restante</strong></span><strong style="color:'+(resta>0?'var(--red)':'var(--green)')+'">'+money(resta)+'</strong></div>'+(l.notas?'<div style="margin-top:10px;padding:8px;background:var(--surface2);border-radius:var(--rs);font-size:13px">'+esc(l.notas)+'</div>':'')+'</div><div style="padding:.75rem 1.25rem;border-top:1px solid var(--border);display:flex;gap:8px"><button class="bp" data-a="printSlip" style="flex:1">Imprimir / Guardar como PDF</button><button data-a="closeSlip" style="flex:1">Cerrar</button></div></div></div>';
}
function slipPrint(l,e){
  const total=n(l.sueldoBruto)+n(l.bonoExtra),cobra=Math.max(0,total-n(l.descuentoDeuda)),resta=Math.max(0,n(l.deudaAlInicio)-n(l.descuentoDeuda)),val=function(v){return Math.round(Math.abs(n(v))).toLocaleString('es-AR');};
  return '<div class="ph"><div><div class="ph-brand">ALISTA AHORRO</div><div class="ph-sub">Recibo de liquidacion de haberes</div></div><div class="ph-meta"><div><b>Periodo:</b> '+esc(l.periodo)+'</div><div><b>Fecha:</b> '+dateLong(l.date)+'</div></div></div><div class="pe"><div class="pe-name">'+esc(e.name)+'</div>'+(e.role?'<div class="pe-role">'+esc(e.role)+'</div>':'')+'</div><div class="ps-title">Remuneracion del periodo</div><table class="pt"><tr><td>Sueldo bruto</td><td>$'+val(l.sueldoBruto)+'</td></tr>'+(n(l.bonoExtra)?'<tr><td style="padding-left:14pt;color:#555">'+(l.bonoDetalle||'Bono extra')+'</td><td>$'+val(l.bonoExtra)+'</td></tr>':'')+'<tr class="sep"><td><b>Total a cobrar</b></td><td>$'+val(total)+'</td></tr></table><div class="ps-title">Deducciones</div><table class="pt"><tr class="red"><td>Descuento aplicado a deuda</td><td>- $'+val(l.descuentoDeuda)+'</td></tr><tr class="total"><td>Cobra en mano (neto)</td><td>$'+val(cobra)+'</td></tr></table><div class="ps-title">Estado de deuda</div><table class="pt"><tr class="red"><td>Deuda acumulada al inicio del periodo</td><td>$'+val(l.deudaAlInicio)+'</td></tr><tr class="green"><td>Descuento aplicado este periodo</td><td>- $'+val(l.descuentoDeuda)+'</td></tr>'+(n(l.deudaFinanciada)?'<tr><td style="color:#555">Queda financiada en cuotas</td><td>$'+val(l.deudaFinanciada)+'</td></tr>':'')+'<tr class="total"><td>Deuda restante</td><td>$'+val(resta)+'</td></tr></table><div class="p-sigs"><div class="p-sig"><strong>Empleado</strong>'+esc(e.name)+'<br><span style="font-size:8pt">Firma y aclaracion</span></div><div class="p-sig"><strong>Empleador</strong>ALISTA AHORRO<br><span style="font-size:8pt">Los Jurien, Santiago del Estero</span></div></div><div class="p-footer">Generado el '+dateLong(Date.now())+' - ALISTA AHORRO</div>';
}
function groupSelectView(){const sorted=[...st.emp].sort(function(a,b){return debt(b.id)-debt(a.id);});const rows=sorted.map(function(e){const d=debt(e.id);const checked=st.groupSel[e.id]?'checked':'';return '<label style="display:flex;align-items:center;gap:12px;padding:10px 14px;background:var(--surface);border:1px solid var(--border);border-radius:var(--r);cursor:pointer;margin-bottom:6px"><input type="checkbox" data-a="toggleGroupEmp" data-id="'+e.id+'" '+checked+' style="width:18px;height:18px;accent-color:var(--navy)">'+avatar(e.name,36)+'<div style="flex:1"><div style="font-weight:500">'+esc(e.name)+'</div>'+(e.role?'<div style="font-size:12px;color:var(--text2)">'+esc(e.role)+'</div>':'')+'</div><div style="font-size:13px;color:'+(d>0?'var(--red)':'var(--green)')+'">'+( d>0?money(d):'Al dia')+'</div></label>';}).join('');const any=Object.values(st.groupSel).some(Boolean);return msg()+'<div style="max-width:680px;margin:0 auto"><div style="display:flex;align-items:center;gap:10px;margin-bottom:16px"><button data-a="cancelGroup" style="font-size:20px;padding:3px 10px;line-height:1">&#x2190;</button><div style="font-weight:600;font-size:17px">Liquidacion grupal</div></div><div style="margin-bottom:12px">'+rows+'</div><button data-a="continueGroup" '+(any?'':'disabled')+' style="width:100%;padding:12px;background:var(--navy);color:#fff;border:none;border-radius:var(--r);cursor:'+(any?'pointer':'not-allowed')+';font-size:15px;font-weight:500;opacity:'+(any?1:.45)+'">Continuar &#x2192;</button></div>';}
function groupLiqForm(){const emps=st.emp.filter(function(e){return st.groupSel[e.id];});const rows=emps.map(function(e){const d=Math.max(0,debt(e.id));const gid=e.id;return '<div class="card" style="margin-bottom:10px"><div style="display:flex;align-items:center;gap:10px;margin-bottom:10px">'+avatar(e.name,32)+'<div><div style="font-weight:500">'+esc(e.name)+'</div>'+(e.role?'<div style="font-size:12px;color:var(--text2)">'+esc(e.role)+'</div>':'')+'</div><div style="margin-left:auto;font-size:13px;color:'+(d>0?'var(--red)':'var(--green)')+';">'+(d>0?'Deuda: '+money(d):'Sin deuda')+'</div></div><div class="g2"><div><div class="lbl">Sueldo bruto ($)</div><input id="gb_'+gid+'" type="number" value="0" min="0"></div><div><div class="lbl">Bono extra ($)</div><input id="gbo_'+gid+'" type="number" value="0" min="0"></div></div><div style="margin-top:8px"><div class="lbl">Detalle del bono</div><input id="gbd_'+gid+'" type="text" placeholder="Ej: Premio presentismo..."></div>'+(d>0?'<div class="g2" style="margin-top:8px"><div><div class="lbl">Descuento a deuda ($)</div><input id="gd_'+gid+'" type="number" value="0" min="0"></div><div><div class="lbl">Queda financiado ($)</div><input id="gf_'+gid+'" type="number" value="0" min="0"></div></div>':'')+'</div>';}).join('');return msg()+'<div style="max-width:680px;margin:0 auto"><div style="display:flex;align-items:center;gap:10px;margin-bottom:16px"><button data-a="cancelGroup" style="font-size:20px;padding:3px 10px;line-height:1">&#x2190;</button><div style="font-weight:600;font-size:17px">Liquidacion grupal</div></div><div class="surf" style="margin-bottom:12px"><div class="lbl">Periodo *</div><input id="gPeriodo" type="text" placeholder="Ej: Semana 03/08 al 08/08" value="'+esc(st.groupPeriodo)+'"></div>'+rows+'<div style="display:flex;gap:10px;margin-top:4px"><button data-a="previewGroup" class="sm" style="flex:1;padding:10px">Resumen (control)</button><button data-a="previewIndividual" class="sm" style="flex:1;padding:10px">Recibos individuales</button><button data-a="saveGroup" style="flex:1;padding:10px 16px;background:var(--navy);color:#fff;border:none;border-radius:var(--r);cursor:pointer;font-size:14px;font-weight:500">Guardar y ver resumen</button></div></div>';}
function groupPrintHTML(periodo,items){const val=function(v){return Math.round(Math.abs(n(v))).toLocaleString('es-AR');};const tB=items.reduce(function(s,x){return s+n(x.bruto)+n(x.bono);},0);const tC=items.reduce(function(s,x){return s+n(x.cobra);},0);const tD=items.reduce(function(s,x){return s+n(x.desc);},0);const tR=items.reduce(function(s,x){return s+Math.max(0,n(x.resta));},0);const rows=items.map(function(x){return '<tr style="border-top:1px solid #ddd"><td style="padding:4pt 3pt;font-size:8.5pt;font-weight:bold">'+esc(x.e.name)+'</td><td style="padding:4pt 3pt;text-align:right;font-size:8.5pt">$'+val(n(x.bruto)+n(x.bono))+'</td><td style="padding:4pt 3pt;text-align:right;font-size:8.5pt;color:#c0392b">'+(x.desc>0?'-$'+val(x.desc):'-')+'</td><td style="padding:4pt 3pt;text-align:right;font-size:8.5pt;font-weight:bold">$'+val(x.cobra)+'</td><td style="padding:4pt 3pt;text-align:right;font-size:8.5pt;color:#c0392b">'+(x.deudaInicio>0?'$'+val(x.deudaInicio):'$0')+'</td><td style="padding:4pt 3pt;text-align:right;font-size:8.5pt;font-weight:bold;color:'+(x.resta>0?'#c0392b':'#1e6b3c')+'">'+(x.resta>0?'$'+val(x.resta):'$0')+'</td></tr>';}).join('');return '<style>@page{size:A4 landscape;margin:1.2cm}</style><div style="font-family:Arial,sans-serif"><div style="display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:8pt;border-bottom:2px solid #1a3a5c;padding-bottom:6pt"><div><div style="font-size:14pt;font-weight:bold;color:#1a3a5c">ALISTA AHORRO</div><div style="font-size:9pt;color:#555">Resumen liquidacion grupal - Control interno</div></div><div style="text-align:right;font-size:9pt"><div><b>Periodo:</b> '+esc(periodo)+'</div><div><b>Fecha:</b> '+dateLong(Date.now())+'</div></div></div><table style="width:100%;border-collapse:collapse"><thead><tr style="background:#1a3a5c;color:#fff"><th style="padding:5pt 3pt;text-align:left;font-size:9pt">Empleado</th><th style="padding:5pt 3pt;text-align:right;font-size:9pt">Sueldo</th><th style="padding:5pt 3pt;text-align:right;font-size:9pt">Desc. deuda</th><th style="padding:5pt 3pt;text-align:right;font-size:9pt">Cobra en mano</th><th style="padding:5pt 3pt;text-align:right;font-size:9pt">Deuda anterior</th><th style="padding:5pt 3pt;text-align:right;font-size:9pt">Deuda restante</th></tr></thead><tbody>'+rows+'</tbody><tfoot><tr style="background:#1a3a5c;color:#fff;font-weight:bold"><td style="padding:5pt 3pt;font-size:9pt">TOTALES ('+items.length+' empleados)</td><td style="padding:5pt 3pt;text-align:right;font-size:9pt">$'+val(tB)+'</td><td style="padding:5pt 3pt;text-align:right;font-size:9pt">-$'+val(tD)+'</td><td style="padding:5pt 3pt;text-align:right;font-size:9pt">$'+val(tC)+'</td><td style="padding:5pt 3pt;text-align:right;font-size:9pt">-</td><td style="padding:5pt 3pt;text-align:right;font-size:9pt">$'+val(tR)+'</td></tr></tfoot></table><div style="margin-top:10pt;background:#fff3cd;border:1px solid #e6ac00;border-radius:4pt;padding:8pt 12pt;display:flex;justify-content:space-between;align-items:center"><div style="font-size:9pt;color:#555">Efectivo a preparar</div><div style="font-size:14pt;font-weight:bold;color:#1a3a5c">$'+val(tC)+'</div></div></div>';}
function groupIndividualPrint(periodo,items){const val=function(v){return Math.round(Math.abs(n(v))).toLocaleString('es-AR');};return items.map(function(x,idx){const pb=idx>0?'page-break-before:always;':'';return '<div style="'+pb+'padding:0"><div class="ph"><div><div class="ph-brand">ALISTA AHORRO</div><div class="ph-sub">Recibo de liquidacion de haberes</div></div><div class="ph-meta"><div><b>Periodo:</b> '+esc(periodo)+'</div><div><b>Fecha:</b> '+dateLong(Date.now())+'</div></div></div><div class="pe"><div class="pe-name">'+esc(x.e.name)+'</div>'+(x.e.role?'<div class="pe-role">'+esc(x.e.role)+'</div>':'')+'</div><div class="ps-title">Remuneracion del periodo</div><table class="pt"><tr><td>Sueldo bruto</td><td>$'+val(x.bruto)+'</td></tr>'+(x.bono?'<tr><td style="padding-left:14pt;color:#555">'+(x.bonoDesc||'Bono extra')+'</td><td>$'+val(x.bono)+'</td></tr>':'')+'<tr class="sep"><td><b>Total a cobrar</b></td><td>$'+val(n(x.bruto)+n(x.bono))+'</td></tr></table><div class="ps-title">Deducciones</div><table class="pt"><tr class="red"><td>Descuento aplicado a deuda</td><td>- $'+val(x.desc)+'</td></tr><tr class="total"><td>Cobra en mano (neto)</td><td>$'+val(x.cobra)+'</td></tr></table><div class="ps-title">Estado de deuda</div><table class="pt"><tr class="red"><td>Deuda acumulada al inicio</td><td>$'+val(x.deudaInicio)+'</td></tr><tr class="green"><td>Descuento aplicado</td><td>- $'+val(x.desc)+'</td></tr><tr class="total"><td>Deuda restante</td><td>$'+val(x.resta)+'</td></tr></table><div class="p-sigs"><div class="p-sig"><strong>Empleado</strong>'+esc(x.e.name)+'<br><span style="font-size:8pt">Firma y aclaracion</span></div><div class="p-sig"><strong>Empleador</strong>ALISTA AHORRO<br><span style="font-size:8pt">Los Jurien, Santiago del Estero</span></div></div><div class="p-footer">Generado el '+dateLong(Date.now())+' - ALISTA AHORRO</div></div>';}).join('');}
function getGroupItems(){
  const periodo=($('gPeriodo')||{value:''}).value.trim();
  const emps=st.emp.filter(function(e){return st.groupSel[e.id];});
  return {periodo:periodo,items:emps.map(function(e){const bruto=n(($('gb_'+e.id)||{value:0}).value),bono=n(($('gbo_'+e.id)||{value:0}).value),bonoDesc=($('gbd_'+e.id)||{value:''}).value.trim(),desc=n(($('gd_'+e.id)||{value:0}).value),fin=n(($('gf_'+e.id)||{value:0}).value),deudaInicio=Math.max(0,debt(e.id)),cobra=Math.max(0,bruto+bono-desc),resta=Math.max(0,deudaInicio-desc);return {e:e,bruto:bruto,bono:bono,bonoDesc:bonoDesc,desc:desc,fin:fin,deudaInicio:deudaInicio,cobra:cobra,resta:resta};})};
}
document.addEventListener('click',function(ev){
  const el=ev.target.closest('[data-a]');if(!el)return;
  const a=el.dataset.a,id=el.dataset.id,e=emp();
  if(a==='clearWarn'){st.warn='';render();}
  if(a==='resetView'){st.view='list';st.modal=null;render();}
  if(a==='back'){st.view='list';st.sel=null;st.showLiq=false;st.editTx=null;st.confirmDel=false;render();}
  if(a==='select'){st.sel=id;st.view='detail';st.tab='mov';st.showLiq=false;st.editTx=null;st.confirmDel=false;render();}
  if(a==='tab'){st.tab=id;render();}
  if(a==='toggleAdd'){st.showAdd=!st.showAdd;render();}
  if(a==='addEmp'){const nm=($('newName')||{value:''}).value.trim();if(!nm)return flash('Falta el nombre.');const ne={id:uid(),name:nm,role:($('newRole')||{value:''}).value.trim(),createdAt:Date.now()};st.emp.push(ne);st.showAdd=false;saveToSB();flash('Empleado agregado.');}
  if(a==='addTx'&&e){const amt=n(($('txAmt')||{value:0}).value);if(!amt)return flash('Ingresa un monto.');const type=($('txType')||{value:'otro'}).value;st.tx.push({id:uid(),employeeId:e.id,type:type,amount:amt,description:($('txDesc')||{value:''}).value.trim(),date:Date.now()});saveToSB();flash('Movimiento registrado.');}
  if(a==='editTx'){st.editTx=id;render();}
  if(a==='cancelEdit'){st.editTx=null;render();}
  if(a==='saveTx'){const t=st.tx.find(function(x){return x.id===id;});if(t){t.type=($('etType')||{value:t.type}).value;t.amount=Math.abs(n(($('etAmt')||{value:t.amount}).value));t.description=($('etDesc')||{value:''}).value.trim();}st.editTx=null;saveToSB();flash('Movimiento actualizado.');}
  if(a==='delTx'){st.tx=st.tx.filter(function(x){return x.id!==id;});sbDelete('transactions',id).catch(function(e){flash('Error: '+e.message);});flash('Movimiento eliminado.');}
  if(a==='showLiq'){st.showLiq=true;render();}
  if(a==='cancelLiq'){st.showLiq=false;render();}
  if(a==='saveLiq'&&e){const per=($('lPer')||{value:''}).value.trim();if(!per)return flash('Falta el periodo.');const sb=n(($('lSB')||{value:0}).value),bo=n(($('lBo')||{value:0}).value),de=n(($('lDe')||{value:0}).value),fi=n(($('lFi')||{value:0}).value);const l={id:uid(),employeeId:e.id,periodo:per,sueldoBruto:sb,bonoExtra:bo,bonoDetalle:($('lBD')||{value:''}).value.trim(),descuentoDeuda:de,deudaFinanciada:fi,notas:($('lNo')||{value:''}).value.trim(),deudaAlInicio:Math.max(0,debt(e.id)),date:Date.now()};st.liq.push(l);if(de>0)st.tx.push({id:uid(),employeeId:e.id,type:'liq_desc',amount:de,description:'Desc. liq. '+per,date:Date.now()});st.showLiq=false;saveToSB();flash('Liquidacion guardada.');}
  if(a==='viewSlip'){st.modal=id;render();}
  if(a==='closeSlip'){st.modal=null;render();}
  if(a==='printSlip'&&e){const l=st.liq.find(function(x){return x.id===st.modal;});if(l){$('print-area').innerHTML=slipPrint(l,e);window.print();}}
  if(a==='delStart'){st.confirmDel=true;render();}
  if(a==='delCancel'){st.confirmDel=false;render();}
  if(a==='delConfirm'&&e){const eid=e.id;st.emp=st.emp.filter(function(x){return x.id!==eid;});st.tx=st.tx.filter(function(x){return x.employeeId!==eid;});st.plans=st.plans.filter(function(x){return x.employeeId!==eid;});st.liq=st.liq.filter(function(x){return x.employeeId!==eid;});st.view='list';st.sel=null;deleteEmpFromSB(eid);saveToSB();flash('Empleado eliminado.');render();}
  if(a==='export'){const d={version:'alista-empleados-supabase',createdAt:new Date().toISOString(),employees:st.emp,transactions:st.tx,plans:st.plans,liquidaciones:st.liq};const b=new Blob([JSON.stringify(d,null,2)],{type:'application/json'});const lk=document.createElement('a');lk.href=URL.createObjectURL(b);lk.download='backup_alista_empleados.json';lk.click();}
  if(a==='import'){$('import-file').click();}
  if(a==='groupLiqStart'){st.view='groupSelect';st.groupSel={};st.groupPeriodo='';render();}
  if(a==='toggleGroupEmp'){st.groupSel[id]=!st.groupSel[id];render();}
  if(a==='cancelGroup'){st.view='list';st.groupSel={};render();}
  if(a==='continueGroup'){if(Object.values(st.groupSel).some(Boolean)){st.view='groupLiq';render();}}
  if(a==='previewIndividual'){const r=getGroupItems();if(!r.periodo)return flash('Falta el periodo.');$('print-area').innerHTML=groupIndividualPrint(r.periodo,r.items);window.print();}
  if(a==='previewGroup'||a==='saveGroup'){
    const r=getGroupItems();if(!r.periodo)return flash('Falta el periodo.');
    if(a==='saveGroup'){st.groupPeriodo=r.periodo;r.items.forEach(function(x){st.liq.push({id:uid(),employeeId:x.e.id,periodo:r.periodo,sueldoBruto:x.bruto,bonoExtra:x.bono,bonoDetalle:x.bonoDesc,descuentoDeuda:x.desc,deudaFinanciada:x.fin,notas:'',deudaAlInicio:x.deudaInicio,date:Date.now()});if(x.desc>0)st.tx.push({id:uid(),employeeId:x.e.id,type:'liq_desc',amount:x.desc,description:'Desc. liq. '+r.periodo,date:Date.now()});});saveToSB();flash('Liquidacion grupal guardada.');}
    $('print-area').innerHTML=groupPrintHTML(r.periodo,r.items);window.print();
    if(a==='saveGroup'){st.view='list';st.groupSel={};st.groupPeriodo='';render();}
  }
});
document.addEventListener('change',function(ev){
  if(ev.target.id==='import-file'){const f=ev.target.files[0];if(!f)return;const r=new FileReader();r.onload=function(e){try{const d=JSON.parse(e.target.result);if(!d.employees)throw new Error('Formato invalido');st.emp=d.employees;st.tx=d.transactions||[];st.liq=d.liquidaciones||[];st.plans=d.plans||[];saveToSB();flash('Datos importados correctamente.');}catch(ex){flash('Error al importar: '+ex.message);}};r.readAsText(f);}
});
init();

}
if(sessionStorage.getItem(SESSION_KEY)==='1'){
  document.getElementById('login-screen').style.display='none';
  document.getElementById('root').style.display='';
  startApp();
}
</script>
